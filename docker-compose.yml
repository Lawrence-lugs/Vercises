services:
  # Image-builder service — produces the vercises-sim:latest image used by ephemeral simulation containers.
  # No profile: docker compose up --build will build this image automatically.
  # CMD ["true"] causes the container to exit immediately with 0; it never runs as a daemon.
  vercises-sim:
    build:
      context: .
      dockerfile: sim/Dockerfile
    image: vercises-sim:latest

  vercises-client:
    restart: unless-stopped
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
      - ./exercises:/app/client/public
      - ./.git:/app/client/.git:ro
    expose:
      - "5173"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.myapp.rule=PathPrefix(`/exercises`)"
      - "traefik.http.routers.myapp.entrypoints=web"
      - "traefik.http.services.myapp.loadbalancer.server.port=5173"
    command: ["sh", "-c", "mkdir -p /app/client/public/surfer && cp -rn /app/surfer-static/. /app/client/public/surfer/ && npm install && npm run dev"]
  vercises-server:
    restart: unless-stopped
    build:
      context: ./server
      dockerfile: Dockerfile
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
      - ./exercises:/app/exercises
      # Docker socket: allows the server to spawn ephemeral simulation containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Share host /tmp so bind-mount paths the server writes resolve on the host daemon
      - /tmp:/tmp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vercisesserver.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.vercisesserver.entrypoints=web"
      - "traefik.http.services.vercisesserver.loadbalancer.server.port=3000"
    expose:
      - "3000"
    # ports:
    #   - "3000:3000"
    command: ["sh", "-c", "npm install && npm run dev"]
    networks:
      - proxy

networks:
  proxy:
    external: true