name: Deploy

on:
  # Only fires when the "Tests" workflow completes successfully on main.
  # This prevents deploying code that has failing tests.
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

jobs:
  dispatch:
    # Hard gate: skip the deploy if the test run did not pass
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: Trigger digital_eee_upd deployment
      run: |
        curl -fsS -X POST \
          -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/Lawrence-lugs/digital_eee_upd/dispatches \
          -d '{"event_type":"vercises-deploy"}'