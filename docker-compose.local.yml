services:
  # Build-only service — produces the vercises-sim:latest image used by ephemeral simulation containers.
  vercises-sim:
    build:
      context: .
      dockerfile: sim/Dockerfile
    image: vercises-sim:latest
    profiles:
      - build-only

  vercises-client:
    restart: unless-stopped
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
      - ./exercises:/app/client/public
      - ./.git:/app/client/.git:ro
    ports:
      - "5173:5173"
    networks:
      - local
    command: ["sh", "-c", "mkdir -p /app/client/public/surfer && cp -rn /app/surfer-static/. /app/client/public/surfer/ && npm install && npm run dev"]

  vercises-server:
    restart: unless-stopped
    build:
      context: ./server
      dockerfile: Dockerfile
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
      - ./exercises:/app/exercises
      # Docker socket: allows the server to spawn ephemeral simulation containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Share host /tmp so bind-mount paths the server writes resolve on the host daemon
      - /tmp:/tmp
    ports:
      - "3000:3000"
    networks:
      local:
        aliases:
          - server
    command: ["sh", "-c", "npm install && npm run dev"]

networks:
  local:
    driver: bridge
